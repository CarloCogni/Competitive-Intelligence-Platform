<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CompIntel — Competitive Intelligence{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 400: '#f9a84d', 500: '#f7931a', 600: '#e07d0e' }
          }
        }
      }
    }
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-gray-950 text-white h-full{% endblock %}"
      {% block body_attrs %}{% endblock %}>
  {% block body %}{% endblock %}
</body>
</html>
