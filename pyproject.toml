[project]
name = "blockstreambi"
version = "0.1.0"
description = "Competitive intelligence dashboard aggregating public signals (GitHub, news, app stores) for tracked organisations"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.3",
    "markdown>=3.7",
    "django-apscheduler>=0.7.0",
    "django-environ>=0.13.0",
    "django-htmx>=1.27.0",
    "feedparser>=6.0.12",
    "requests>=2.33.1",
    "scikit-learn>=1.5",
    "google-play-scraper>=1.2.7",
    "nh3>=0.3.4",
    "trafilatura>=2.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "responses>=0.26.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["src"]
testpaths = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
